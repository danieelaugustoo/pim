<rect x="40.0" y="30.0" width="296" height="112" rx="9" fill="#e8eefc" stroke="#4a5d9a" stroke-width="2.4"/>
<text x="188.0" y="80" font-size="22" text-anchor="middle" fill="#111">1. Porteiro registra</text>
<text x="188.0" y="107" font-size="22" text-anchor="middle" fill="#111">a encomenda (US01)</text>
<rect x="412.0" y="30.0" width="296" height="112" rx="9" fill="#e8eefc" stroke="#4a5d9a" stroke-width="2.4"/>
<text x="560.0" y="67" font-size="22" text-anchor="middle" fill="#111">2. Sistema escolhe a</text>
<text x="560.0" y="94" font-size="22" text-anchor="middle" fill="#111">posição (A1) e gera</text>
<text x="560.0" y="121" font-size="22" text-anchor="middle" fill="#111">o código (A2)</text>
<rect x="784.0" y="30.0" width="296" height="112" rx="9" fill="#e8eefc" stroke="#4a5d9a" stroke-width="2.4"/>
<text x="932.0" y="67" font-size="22" text-anchor="middle" fill="#111">3. Grava em arquivo</text>
<text x="932.0" y="94" font-size="22" text-anchor="middle" fill="#111">(protótipo) ou banco</text>
<text x="932.0" y="121" font-size="22" text-anchor="middle" fill="#111">(sistema completo)</text>
<rect x="1156.0" y="30.0" width="296" height="112" rx="9" fill="#e8eefc" stroke="#4a5d9a" stroke-width="2.4"/>
<text x="1304.0" y="80" font-size="22" text-anchor="middle" fill="#111">4. Aviso ao morador:</text>
<text x="1304.0" y="107" font-size="22" text-anchor="middle" fill="#111">app, SMS ou interfone</text>
<rect x="1156.0" y="206.0" width="296" height="112" rx="9" fill="#e8eefc" stroke="#4a5d9a" stroke-width="2.4"/>
<text x="1304.0" y="256" font-size="22" text-anchor="middle" fill="#111">5. Morador informa</text>
<text x="1304.0" y="283" font-size="22" text-anchor="middle" fill="#111">o código</text>
<polygon points="932.0,186.0 1086.0,262.0 932.0,338.0 778.0,262.0" fill="#fff4d6" stroke="#8a6d1d" stroke-width="2.4"/>
<text x="932.0" y="243" font-size="22" text-anchor="middle" fill="#111">Código</text>
<text x="932.0" y="270" font-size="22" text-anchor="middle" fill="#111">confere?</text>
<text x="932.0" y="297" font-size="22" text-anchor="middle" fill="#111">(até 3 vezes)</text>
<rect x="412.0" y="206.0" width="296" height="112" rx="56.0" fill="#dcefe0" stroke="#3c7a4a" stroke-width="2.4"/>
<text x="560.0" y="243" font-size="22" text-anchor="middle" fill="#111">Retirada negada;</text>
<text x="560.0" y="270" font-size="22" text-anchor="middle" fill="#111">encomenda continua</text>
<text x="560.0" y="297" font-size="22" text-anchor="middle" fill="#111">pendente</text>
<rect x="784.0" y="382.0" width="296" height="112" rx="9" fill="#e8eefc" stroke="#4a5d9a" stroke-width="2.4"/>
<text x="932.0" y="419" font-size="22" text-anchor="middle" fill="#111">6. Retirada registrada</text>
<text x="932.0" y="446" font-size="22" text-anchor="middle" fill="#111">e posição liberada</text>
<text x="932.0" y="473" font-size="22" text-anchor="middle" fill="#111">(A3)</text>
<rect x="412.0" y="382.0" width="296" height="112" rx="9" fill="#e8eefc" stroke="#4a5d9a" stroke-width="2.4"/>
<text x="560.0" y="419" font-size="22" text-anchor="middle" fill="#111">Registro e retirada</text>
<text x="560.0" y="446" font-size="22" text-anchor="middle" fill="#111">entram na fila</text>
<text x="560.0" y="473" font-size="22" text-anchor="middle" fill="#111">de operações (US09)</text>
<polygon points="188.0,362.0 342.0,438.0 188.0,514.0 34.0,438.0" fill="#fff4d6" stroke="#8a6d1d" stroke-width="2.4"/>
<text x="188.0" y="432" font-size="22" text-anchor="middle" fill="#111">Há</text>
<text x="188.0" y="459" font-size="22" text-anchor="middle" fill="#111">conexão?</text>
<rect x="40.0" y="206.0" width="296" height="112" rx="9" fill="#e8eefc" stroke="#4a5d9a" stroke-width="2.4"/>
<text x="188.0" y="243" font-size="22" text-anchor="middle" fill="#111">A fila espera; a</text>
<text x="188.0" y="270" font-size="22" text-anchor="middle" fill="#111">portaria continua</text>
<text x="188.0" y="297" font-size="22" text-anchor="middle" fill="#111">trabalhando</text>
<rect x="40.0" y="558.0" width="296" height="112" rx="9" fill="#e8eefc" stroke="#4a5d9a" stroke-width="2.4"/>
<text x="188.0" y="595" font-size="22" text-anchor="middle" fill="#111">Envio da fila (A4):</text>
<text x="188.0" y="622" font-size="22" text-anchor="middle" fill="#111">VPN e HTTPS no</text>
<text x="188.0" y="649" font-size="22" text-anchor="middle" fill="#111">sistema completo</text>
<polygon points="560.0,538.0 714.0,614.0 560.0,690.0 406.0,614.0" fill="#fff4d6" stroke="#8a6d1d" stroke-width="2.4"/>
<text x="560.0" y="595" font-size="22" text-anchor="middle" fill="#111">id da operação</text>
<text x="560.0" y="622" font-size="22" text-anchor="middle" fill="#111">já foi</text>
<text x="560.0" y="649" font-size="22" text-anchor="middle" fill="#111">aplicado?</text>
<rect x="784.0" y="558.0" width="296" height="112" rx="9" fill="#e8eefc" stroke="#4a5d9a" stroke-width="2.4"/>
<text x="932.0" y="608" font-size="22" text-anchor="middle" fill="#111">Ignora a operação</text>
<text x="932.0" y="635" font-size="22" text-anchor="middle" fill="#111">(ADR-003)</text>
<rect x="412.0" y="734.0" width="296" height="112" rx="9" fill="#e8eefc" stroke="#4a5d9a" stroke-width="2.4"/>
<text x="560.0" y="784" font-size="22" text-anchor="middle" fill="#111">Aplica a operação</text>
<text x="560.0" y="811" font-size="22" text-anchor="middle" fill="#111">(A5)</text>
<rect x="784.0" y="734.0" width="296" height="112" rx="9" fill="#e8eefc" stroke="#4a5d9a" stroke-width="2.4"/>
<text x="932.0" y="771" font-size="22" text-anchor="middle" fill="#111">Consolidado e</text>
<text x="932.0" y="798" font-size="22" text-anchor="middle" fill="#111">relatórios</text>
<text x="932.0" y="825" font-size="22" text-anchor="middle" fill="#111">(A6, US12 a US14)</text>
<rect x="1156.0" y="734.0" width="296" height="112" rx="56.0" fill="#dcefe0" stroke="#3c7a4a" stroke-width="2.4"/>
<text x="1304.0" y="771" font-size="22" text-anchor="middle" fill="#111">Indicadores: tempo,</text>
<text x="1304.0" y="798" font-size="22" text-anchor="middle" fill="#111">pendências antigas</text>
<text x="1304.0" y="825" font-size="22" text-anchor="middle" fill="#111">e extravios</text>
</svg>