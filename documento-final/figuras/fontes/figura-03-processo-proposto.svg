<text x="932.0" y="121" font-size="22" text-anchor="middle" fill="#111">na estante</text>
<rect x="1156.0" y="30.0" width="296" height="112" rx="9" fill="#e8eefc" stroke="#4a5d9a" stroke-width="2.4"/>
<text x="1304.0" y="67" font-size="22" text-anchor="middle" fill="#111">Sistema gera código</text>
