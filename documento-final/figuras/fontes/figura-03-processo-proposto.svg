<rect x="40.0" y="30.0" width="296" height="112" rx="56.0" fill="#dcefe0" stroke="#3c7a4a" stroke-width="2.4"/>
<text x="188.0" y="80" font-size="22" text-anchor="middle" fill="#111">Encomenda chega</text>
